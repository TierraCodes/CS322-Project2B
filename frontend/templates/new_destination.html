{% extends "base.html" %}

{% block content %}
    <br>
    <h1>Add A New Destination</h1>

    <form action="{{ url_for('new_destination') }}" method="POST">

        <label for="dest_name">Destination Name:</label>
        <input type="text" id="dest_name" name="dest_name" maxlength="20" required>
        <br><br>
        <label for="dest_notes">Destination Notes:</label>
        <input type="text" id="dest_notes" name="dest_notes" maxlength="20" placeholder="Quick notes..." required>
        <br><br>
        <label for="dest_cost">Estimated Cost:</label>
        <input type="number" id="dest_cost" name="dest_cost" step="0.01" placeholder="0.00" required>
        <br><br>
        <button type="submit" class="btn-update">Submit Destination</button>
    </form>
    <p><a href="{{ url_for('home') }}">Back to list</a></p>
{% endblock %}
